    <!-- formulario -->

<!-- Sección para centrar la tarjeta debajo del navbar -->
  <div class="login-section">
    <div class="login-card">
      
      <!-- Panel Izquierdo: Imagen -->
      <div class="login-image">
        <img src="../images/inicio1.jpg" alt="Camarógrafo CINEACTA / Film Crew">
      </div>

      <!-- Panel Derecho: Contenido -->
      <div class="login-content">
        
        <!-- Pestañas de Navegación -->
        <div class="tabs">
          <button type="button" id="tab-login" class="tab-btn active">Iniciar sesión</button>
          <button type="button" id="tab-register" class="tab-btn">Crear cuenta</button>
        </div>

        <!-- Formulario 1: Iniciar Sesión -->
        <form id="form-login" class="auth-form active">
          <div class="form-group">
            <label for="login-user">Usuario</label>
            <input type="text" id="login-user" required>
          </div>

          <div class="form-group">
            <label for="login-pass">Contraseña</label>
            <input type="password" id="login-pass" required>
          </div>

          <button type="submit" class="btn-submit">Iniciar sesión</button>
          <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
        </form>

        <!-- Formulario 2: Crear Cuenta -->
        <form id="form-register" class="auth-form">
          <div class="form-group">
            <label for="reg-nombre">Nombre</label>
            <input type="text" id="reg-nombre" required>
          </div>

          <div class="form-group">
            <label for="reg-celular">Celular</label>
            <input type="tel" id="reg-celular" required>
          </div>

          <div class="form-group">
            <label for="reg-correo">Correo</label>
            <input type="email" id="reg-correo" required>
          </div>

          <div class="form-group">
            <label>Fecha de nacimiento</label>
            <div class="dob-container">
              <input type="text" id="dob-day" placeholder="DD" maxlength="2" required>
              <input type="text" id="dob-month" placeholder="MM" maxlength="2" required>
              <input type="text" id="dob-year" placeholder="YYYY" maxlength="4" required>
            </div>
          </div>

          <button type="submit" class="btn-submit">Crear cuenta</button>
        </form>

      </div>
    </div>
  </div>
